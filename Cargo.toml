[package]
name = "busd"
version = "0.7.0"
authors = ["Zeeshan Ali Khan <zeeshanak@gnome.org>"]
description = "A D-Bus bus (broker) implementation"
edition = "2021"
license = "MIT"
readme = "README.md"
rust-version = "1.89"
repository = "https://github.com/z-galaxy/busd"
keywords = ["D-Bus", "DBus", "IPC"]
categories = ["network-programming"]
# The tooling of the repository, such as its CI, git hooks and guidance for AI agents, is of no use
# to those who build the crate. `LICENSE` is a link to `LICENSE-MIT`, so cargo would pack the
# license twice.
exclude = [
    ".commitlintrc.mjs",
    ".githooks/",
    ".github/",
    ".gitignore",
    "AGENTS.md",
    "CLAUDE.md",
    "LICENSE",
    "release-plz.toml",
]

[lib]
name = "busd"
path = "src/lib.rs"
bench = false

[[bin]]
name = "busd"
path = "src/bin/busd.rs"
bench = false

# What the bus costs to route the traffic of its clients, which CodSpeed measures by the clock on
# every push to `main` and every pull request (`.github/workflows/bench.yml`).
[[bench]]
name = "bus"
harness = false

# busd against other brokers, such as dbus-broker and dbus-daemon: it needs them installed, and
# takes a while, so neither `cargo bench` nor CI runs it unless asked to, with
# `cargo bench --bench compare`. `benches/README.md` says how.
[[bench]]
name = "compare"
harness = false
bench = false

[dependencies]
zbus = { version = "6.3.0", features = [
    "default-rt",
    "bus-impl",
    "service",
    "handover",
], default-features = false }
clap = { version = "4.5.4", features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
], default-features = false }
tracing = { version = "0.1.40", optional = true }
tracing-subscriber = { version = "0.3.18", features = [
    "fmt",
    "ansi",
], default-features = false, optional = true }
anyhow = "1.0.82"
# Explicitly depend on serde to enable `rc` feature.
serde = { version = "1.0.200", features = ["rc"] }
futures-util = { version = "0.3.30", default-features = false, features = ["alloc"] }
zruntime = { version = "0.2.2", features = [
    "fs",
    "helper",
    "lock",
    "signal",
    "unblock",
    "unix",
], default-features = false }
fastrand = "2.2.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }

# `net` is for the sockets of the bus, and `process` for its limit of open file descriptors. `std`
# makes rustix share the types of std with its callers (`OwnedFd`, `io::Error`).
rustix = { version = "1.1.2", default-features = false, features = ["net", "process", "std"] }
foldhash = "0.2.0"
# Draws the diagrams of the docs, which are in mermaid, in the HTML that `cargo doc` builds.
simple-mermaid = "0.2.0"

# Restarts through the file descriptor store of systemd, with the clients connected throughout.
# zbus builds on it too, and Cargo builds one zoter for both, so the hand-overs of zbus are items
# of its hand-overs.
[target.'cfg(target_os = "linux")'.dependencies.zoter]
version = "0.2.0"
default-features = false

[features]
default = ["tracing-subscriber"]
tracing = ["dep:tracing", "zbus/tracing", "zruntime/tracing", "zoter/tracing"]
tracing-subscriber = ["tracing", "dep:tracing-subscriber"]

[dev-dependencies]
# The tests drive the bus through proxies, which the binary itself does not need. The benchmarks
# send byte arrays with `serde_bytes`, which (de)serializes them whole rather than byte by byte.
zbus = { version = "6.3.0", features = [
    "proxy",
    "serde_bytes",
], default-features = false }
ntest = "0.10.0"
rand = "0.10.0"
futures-util = { version = "0.3.30", default-features = true }
tracing = "0.1.40"
# `thread` pins the threads of the benchmarks to CPUs of their own, and `param` tells the
# comparison with other brokers how long a clock tick of the CPU times of /proc is.
rustix = { version = "1.1.2", features = ["net", "process", "thread", "param"] }
criterion = { version = "6.0.0", package = "codspeed-criterion-compat" }
serde = { version = "1.0.200", features = ["derive"] }
serde_bytes = "0.11.19"
# The channels that stop the services and the bus of the benchmarks, and hand the replies on a
# shared connection to their callers.
zruntime = { version = "0.2.2", features = ["mpmc"], default-features = false }
# The comparison with other brokers writes its results as JSON, and reads them back: its runs keep
# the order of their fields, and their numbers read back exactly as they were written.
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }

# The comparison with other brokers measures the CPU time of their processes with `getrusage`,
# which rustix has no call for.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.191"

# The tests restart busd through zoter's fake service manager, and the fake systemd of the
# benchmark creates its stores with zoter's `testing::store`.
[target.'cfg(target_os = "linux")'.dev-dependencies.zoter]
version = "0.2.0"
default-features = false
features = ["testing"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
# generates a separate *.dwp/*.dSYM so the binary can get stripped
split-debuginfo = "packed"
strip = "symbols"
# No one needs an undebuggable release binary
debug = "full"

# The benchmarks build busd with the optimizations of the release profile, but keep its symbols in
# the binary, so that CodSpeed can tell which functions the time goes to. It does not ship quite so:
# cargo builds every benchmark to unwind on a panic, and with the features of the dev-dependencies.
[profile.bench]
split-debuginfo = "off"
strip = "none"

# busd needs these zoter changes:
# - A hand-over is stored whole and taken over whole, or either fails.
# - A store exists only where systemd keeps one that can hold a hand-over, and has passed busd a
#   socket of socket activation (`Error::NoSocket`): zoter fails to create it otherwise. Its error
#   tells a process that systemd takes no notifications from apart (`Error::NoManager`), which
#   busd runs without a store on.
# - The store itself stores the hand-over (`Store::hand_over`), and tells systemd that busd has
#   started as busd takes over (`Store::take_over`).
# zoter has them from 0.2.0 on, which is not released yet. Until it is, busd builds on the zoter
# revision that has them. It must be the revision that zbus uses, so that Cargo builds a single
# zoter for both. This patch goes away when busd takes that release from crates.io.
[patch.crates-io.zoter]
git = "https://github.com/z-galaxy/zoter"
rev = "4a89183d62ed13ae3278e38c0565de6b98122707"

# The zbus on crates.io builds on zoter 0.1. busd stores zbus's hand-overs inside the hand-overs
# of its own zoter, so both must build on the same zoter. busd also needs these zbus changes:
# - It hands the connection on which it serves the D-Bus API over to its next instance, together
#   with its object server (`Connection::hand_over`).
# - It makes the signals that follow its replies part of their calls, so that this hand-over
#   waits for them (`ResponseDispatchNotifier::followed_by`).
# - It hands both ends of that connection over as one item of the hand-over (`ChannelHandover`).
# - It answers the calls that wait on a peer that leaves, from the caller and the serial of each
#   call, which is all it keeps of them (`Message::error_for_serial`).
# zbus has not released these yet. Until it does, busd builds on the zbus revision that has them.
# This patch goes away when busd takes that release from crates.io.
[patch.crates-io.zbus]
git = "https://github.com/z-galaxy/zbus"
rev = "941b3a699dfa888e95309b5469671d06e666c41e"
