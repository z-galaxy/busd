[package]
name = "busd"
version = "0.5.0"
authors = ["Zeeshan Ali Khan <zeeshanak@gnome.org>"]
description = "A D-Bus bus (broker) implementation"
edition = "2021"
license = "MIT"
readme = "README.md"
rust-version = "1.89"
repository = "https://github.com/z-galaxy/busd"
keywords = ["D-Bus", "DBus", "IPC"]
categories = ["network-programming"]
exclude = ["LICENSE"]

[lib]
name = "busd"
path = "src/lib.rs"

[[bin]]
name = "busd"
path = "src/bin/busd.rs"

[dependencies]
zbus = { version = "6.0.0", features = [
    "default-rt",
    "bus-impl",
    "service",
], default-features = false }
clap = { version = "4.5.4", features = [
    "derive",
    "std",
    "help",
], default-features = false }
tracing = { version = "0.1.40", optional = true }
tracing-subscriber = { version = "0.3.18", features = [
    "fmt",
    "ansi",
], default-features = false, optional = true }
anyhow = "1.0.82"
# Explicitly depend on serde to enable `rc` feature.
serde = { version = "1.0.200", features = ["rc"] }
futures-util = { version = "0.3.30", default-features = false, features = ["alloc"] }
xdg-home = "1.1.0"
zruntime = { version = "0.2.1", features = [
    "fs",
    "helper",
    "lock",
    "signal",
    "tcp",
    "unblock",
    "unix",
], default-features = false }
fastrand = "2.2.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }

rustix = { version = "1.1.2", default-features = false, features = ["process"] }
foldhash = "0.2.0"

[features]
default = ["tracing-subscriber"]
tracing = ["dep:tracing", "zbus/tracing", "zruntime/tracing"]
tracing-subscriber = ["tracing", "dep:tracing-subscriber"]

[dev-dependencies]
# The tests drive the bus through proxies, which the binary itself does not need.
zbus = { version = "6.0.0", features = [
    "proxy",
], default-features = false }
ntest = "0.10.0"
rand = "0.10.0"
futures-util = { version = "0.3.30", default-features = true }
tracing = "0.1.40"
rustix = { version = "1.1.2", features = ["net", "process"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
# generates a separate *.dwp/*.dSYM so the binary can get stripped
split-debuginfo = "packed"
strip = "symbols"
# No one needs an undebuggable release binary
debug = "full"

# The time limit on each send to a client reads the clock only once the send has to wait, as of
# z-galaxy/zruntime#58, and the socket of a client that a wait found readable stays watched until
# the task that the wait woke has run, rather than being let go of and watched again for each
# message where many clients are busy, as of z-galaxy/zruntime#60. No release of zruntime has
# either yet. Patching crates.io's zruntime, rather than depending on it from git, has zbus build on
# it too: busd and zbus must share one runtime.
[patch.crates-io.zruntime]
git = "https://github.com/z-galaxy/zruntime"
rev = "b3bd01d8fc1827c690d2525a157694afd030ea4b"

# The bus writes the messages that it forwards to a client in one go, with `Connection::send_all`
# (z-galaxy/zbus#2079), and decodes the header of each message that it receives in one pass
# (z-galaxy/zbus#2081), with a cheaper parse of the signature of its body (z-galaxy/zbus#2083), and
# has zbus check the body of each message of its clients as it receives it, and sets the sender of
# a message with `Message::with_sender` (z-galaxy/zbus#2086).
# zbus's main branch has these, but no release of zbus yet. Patching crates.io's zbus, rather than
# depending on it from git, has the tests, which depend on zbus too, build on it as well.
[patch.crates-io.zbus]
git = "https://github.com/z-galaxy/zbus"
rev = "d63e85291a8976f7aabfa61c17325100e4adb674"
